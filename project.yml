name: AstraAI
options:
  bundleIdPrefix: com.astraai
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  AstroCore:
    path: Packages/AstroCore
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AstraAI:
    type: application
    platform: iOS
    sources: [AstraAI]
    dependencies:
      - package: AstroCore
      - package: RevenueCat
        product: RevenueCat
    info:
      path: AstraAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: AstraAI
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CLAUDE_BASE_URL: $(CLAUDE_BASE_URL)
        ASTRA_APP_TOKEN: $(ASTRA_APP_TOKEN)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astraai.in
        DEVELOPMENT_TEAM: YUS4TVU33T
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AstraAI:
    build:
      targets:
        AstraAI: all
    run:
      config: Debug
      storeKitConfiguration: AstraAI/Resources/AstraAI.storekit
    test:
      targets:
        - package: AstroCore/AstroCoreTests
